[package]
name = "opensecure"
version = "1.0.0"
description = "Local-first personal operating system"
authors = ["Xmausix"]
edition = "2021"
[lib]
name = "opensecure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
